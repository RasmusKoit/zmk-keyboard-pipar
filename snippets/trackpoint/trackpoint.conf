CONFIG_PIPAR_POINT_TRACKPOINT=y

# BT controller priority demotion — keeps GPIOTE@prio0 from racing the
# BLE link-layer. Normally selected by the PS/2 driver Kconfig; setting
# explicitly is defense-in-depth and a no-op when the SW controller
# isn't in use.
CONFIG_BT_CTLR_LLL_PRIO=1
CONFIG_BT_CTLR_ULL_HIGH_PRIO=2
CONFIG_BT_CTLR_ULL_LOW_PRIO=2
